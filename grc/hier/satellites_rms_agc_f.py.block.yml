id: satellites_rms_agc_f
label: RMS AGC (Float)
category: '[Satellites]/Level Controllers'

parameters:
-   id: alpha
    label: Alpha
    dtype: real
    default: 1e-2
    hide: none
-   id: reference
    label: Reference
    dtype: real
    default: '1.0'
    hide: none

inputs:
-   label: in
    dtype: float
    vlen: 1

outputs:
-   label: out
    dtype: float
    vlen: 1

templates:
    imports: import satellites.hier
    make: satellites.hier.rms_agc_f(alpha=${ alpha }, reference=${ reference })
    callbacks:
    - set_alpha(${ alpha })
    - set_reference(${ reference })

file_format: 1
